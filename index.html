<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarl">
<meta name="theme-color" content="#16344C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Jarl: Strength after 50</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: one phone-width column, calm stone surfaces, bottom tab bar; the workout player opens full-screen over it */
:root{
  /* Fjord: deep navy, brass and weathered stone. Calm, high-contrast, grown-up */
  --bg:#ECEEEE; --surface:#FFFFFF; --sunk:#E0E5E7; --ink:#16212B; --muted:#56626D; --line:#CDD5DA;
  --accent:#1F4B6E; --accent-ink:#FFFFFF; --accent-soft:#DAE5EE; --brass:#94692A; --brass-soft:#F0E5D1;
  --rest:#3E6B58; --rest-soft:#DCE9E2; --warn:#A0551C; --warn-soft:#F5E3D3; --alert:#B3261E; --alert-soft:#F8DEDA;
  --far:#A5AFB8; --eq:#B9C2C9; --eqsoft:#E3E8EB;
  --z1:#8A949C; --z2:#2F7FC1; --z3:#2E9A5B; --z4:#DB8216; --z5:#D23B2E;
  --display:'Archivo','Arial Narrow',Arial,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
  --hero-bg:#16344C; --hero-ink:#EEF2F5; --hero-muted:#A9BBCB; --hero-line:#2C4C66; --hero-far:#5F7890; --hero-eq:#3F5E7A; --hero-eqsoft:#21405B; --hero-brass:#D9B064; --hero-suit:#C3CED8; --hero-hair:#8FA0B0; --suit:var(--ink); --hair:var(--muted);
}
:root[data-scheme="pine"]{--accent:#2C654A; --accent-soft:#DCEAE2; --brass:#8A6A2C;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#152029; --sunk:#1C2934; --ink:#E4EAEF; --muted:#9AA8B4; --line:#2A3845;
  --accent:#8CB9DA; --accent-ink:#0B1520; --accent-soft:#1B3043; --brass:#D6AD62; --brass-soft:#33291A;
  --rest:#86BFA3; --rest-soft:#1A2F25; --warn:#E0A060; --warn-soft:#35261A; --alert:#F2A097; --alert-soft:#3A201D;
  --far:#56636F; --eq:#3E4D5A; --eqsoft:#1E2A35; --z1:#9AA6AF; --z2:#5AA6E6; --z3:#55C285; --z4:#F0A44A; --z5:#F0695C; color-scheme:dark }
  :root:not([data-theme="light"])[data-scheme="pine"]{--accent:#72B891; --accent-soft:#1F3328; --accent-ink:#0F1A14;} }
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#152029; --sunk:#1C2934; --ink:#E4EAEF; --muted:#9AA8B4; --line:#2A3845;
  --accent:#8CB9DA; --accent-ink:#0B1520; --accent-soft:#1B3043; --brass:#D6AD62; --brass-soft:#33291A;
  --rest:#86BFA3; --rest-soft:#1A2F25; --warn:#E0A060; --warn-soft:#35261A; --alert:#F2A097; --alert-soft:#3A201D;
  --far:#56636F; --eq:#3E4D5A; --eqsoft:#1E2A35; --z1:#9AA6AF; --z2:#5AA6E6; --z3:#55C285; --z4:#F0A44A; --z5:#F0695C; color-scheme:dark }
:root[data-theme="dark"][data-scheme="pine"]{--accent:#72B891; --accent-soft:#1F3328; --accent-ink:#0F1A14;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
@media (min-width:700px){:root{--col:680px}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.125rem;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:var(--col,480px);margin:0 auto;padding-inline:20px;padding-block:20px 128px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.coach{border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.coach.rest{border-color:var(--rest)}
.btn{min-height:56px;border-radius:12px;padding:0 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk)}
.btn.link{min-height:44px;width:auto;padding:0 4px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.rest{background:var(--rest-soft);color:var(--rest)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.plain{background:var(--sunk);color:var(--muted)}

.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.brand b{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:1.35rem;letter-spacing:.14em;color:var(--brass)}
.brand span{font-size:.85rem;color:var(--muted)}
/* 2.0 */
.zones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.zones div{display:flex;flex-direction:column;gap:1px;font-size:.75rem;min-width:0}
.zones span{height:8px;border-radius:4px}
.zones b{font-size:.8rem}
.zones small{color:var(--muted);font-size:.7rem;overflow-wrap:anywhere}
.bodymap{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.bodymap svg{width:100%;max-width:300px;height:auto}
.bodymap figcaption{width:100%;max-width:300px;display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:-4px}
.maplegend{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.maplegend i{width:12px;height:12px;border-radius:3px;background:var(--accent);display:inline-block}
details.map summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem;list-style:none}
details.map summary::-webkit-details-marker{display:none}
#player.dark{--bg:#0E151C; --surface:#152029; --sunk:#1C2934; --ink:#E4EAEF; --muted:#9AA8B4; --line:#2A3845; --accent:#8CB9DA; --accent-ink:#0B1520; --accent-soft:#1B3043; --brass:#D6AD62; --rest-soft:#1A2F25; --far:#56636F; --eq:#3E4D5A; --eqsoft:#1E2A35; --z1:#9AA6AF; --z2:#5AA6E6; --z3:#55C285; --z4:#F0A44A; --z5:#F0695C; color-scheme:dark; background:var(--bg); color:var(--ink)}
/* 1.7 */
.ckgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.breath{background:var(--rest-soft);color:var(--ink);border-radius:10px;padding:8px 12px}
/* user agreement */
#terms{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:30;padding-top:env(safe-area-inset-top,0px)}
.legal{max-width:var(--col,480px);margin:0 auto;padding-inline:20px;padding-block:18px 40px;display:flex;flex-direction:column;gap:12px}
.legal h1{font-size:1.5rem}
.legal h2{font-size:1.05rem;margin-top:10px}
.legal p,.legal li{font-size:.95rem;line-height:1.55}
.legal ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.accept{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.accept .in{max-width:var(--col,480px);margin:0 auto;display:flex;flex-direction:column;gap:12px}
.check{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:.95rem;cursor:pointer}
.check input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* training days */
.daychips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.daychips button{min-width:0;padding:0;min-height:48px;border-radius:10px;background:var(--sunk);font-weight:700;font-size:.78rem;color:var(--muted)}
.daychips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.daypick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.daypick .opt{align-items:center;text-align:center}
.daypick .opt:disabled{opacity:.45;cursor:not-allowed}
button.day{font:inherit;color:inherit;cursor:pointer}
button.day .dot{box-shadow:0 0 0 0 transparent}
button.day:hover .dot{background:var(--accent-soft)}
/* front page */
.hero{--suit:var(--hero-suit);--hair:var(--hero-hair);--ink:var(--hero-ink);--far:var(--hero-far);--eq:var(--hero-eq);--eqsoft:var(--hero-eqsoft);--brass:var(--hero-brass);--bg:var(--hero-bg);--muted:var(--hero-muted);--sunk:transparent;
  background:var(--hero-bg);color:var(--hero-ink);border-radius:22px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.hero .mark{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--hero-line);padding-bottom:12px}
.hero .mark b{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:1.6rem;letter-spacing:.2em;color:var(--hero-brass)}
.hero .mark span{font-size:.85rem;color:var(--hero-muted);letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:2.15rem;line-height:1.05}
.hero p{color:var(--hero-muted)}
.portrait-img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.portrait{display:block;width:100%;max-width:320px;margin:-4px auto -18px}
.portrait svg{width:100%;height:auto;display:block}
.p-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.p-head{transform-origin:150px 160px;animation:nod 7s ease-in-out infinite}
.p-breathe{animation:breathe 5s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.5deg) translateY(-1px)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@media (prefers-reduced-motion: reduce){.p-eyes,.p-head,.p-breathe{animation:none}}
.promise{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.promise:first-child{border-top:0;padding-top:0}
.promise .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.promise .ic svg{width:24px;height:24px}
.fact{border-left:4px solid var(--brass);padding:4px 0 4px 14px;font-size:1.05rem}
.fact small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
/* exercise demos */
.demo{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;background:var(--sunk);border-radius:12px;padding:8px 8px 6px}
.demo svg{width:100%;height:auto;max-height:230px;display:block}
.demo-state{color:var(--muted);font-size:.75rem}
.exname{text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:2px;text-underline-offset:4px;padding:0}
.exname:hover{text-decoration-color:var(--accent)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
/* heart rate */
.hr{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.hr svg{width:16px;height:16px;fill:var(--hrc,var(--accent));animation:beat 1s ease-in-out infinite}
.hr small{font-weight:400;color:var(--muted)}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}}
.src{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.src:first-of-type{border-top:0}
.status{font-size:.85rem;font-weight:700}
.status.on{color:var(--accent)} .status.off{color:var(--muted)}
.perm{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px}
.perm li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.perm li:first-child{border-top:0}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:12px;font-size:.85rem;color:var(--muted)}
.day .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;border:2px dashed var(--line)}
.day.done .dot{background:var(--accent);color:var(--accent-ink);border:0}
.day.plan .dot{border:2px solid var(--accent);color:var(--accent)}
.day.today{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}

/* exercise list */
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.exlist li:first-child{border-top:0}
.exlist .n{font-family:var(--display);font-weight:800;color:var(--muted);padding-top:1px}
.exlist .sr{color:var(--muted);font-size:.9rem;white-space:nowrap;padding-top:2px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs .in{max-width:var(--col,480px);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;font-size:.8rem;color:var(--muted);font-weight:700}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}

/* numbers */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini b{font-family:var(--display);font-size:1.5rem;font-weight:800}
.mini span{font-size:.8rem;color:var(--muted)}
.up{color:var(--accent);font-weight:700;font-size:.85rem}
.bigval{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1}
.spark{width:100%;height:auto;display:block}
.bands{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.bands div{flex:1;background:var(--sunk)}
.bands div.on{background:var(--accent)}
.bandlbl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.bandlbl span{flex:1;text-align:center}

/* coverage table */
.tblwrap{overflow-x:auto}
table.cov{width:100%;border-collapse:collapse;font-size:.95rem}
table.cov th,table.cov td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
table.cov th:first-child,table.cov td:first-child{text-align:left}
table.cov thead th{font-family:var(--display);font-weight:800}
.cdot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.cdot.no{background:transparent;border:2px solid var(--line)}

/* toggles */
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch input{appearance:none;width:56px;height:32px;border-radius:99px;background:var(--sunk);position:relative;flex:none;cursor:pointer;border:1px solid var(--line)}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(24px)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:46px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{display:flex;align-items:center;justify-content:space-between;gap:16px}
.field input{width:90px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:center}

/* player */
#player{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.phead{position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.phead .in{max-width:var(--col,480px);margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.pwrap{max-width:var(--col,480px);margin:0 auto;padding-inline:20px;padding-block:18px 160px;display:flex;flex-direction:column;gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.step>button.head{width:100%;display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:14px 16px;text-align:left}
.step .badge{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-family:var(--display);font-weight:800;font-size:.9rem}
.step.done .badge{background:var(--accent);color:var(--accent-ink)}
.step.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.setchip{padding:6px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.9rem}
.setchip.todo{background:var(--sunk);color:var(--muted);font-weight:400}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{background:var(--sunk);border-radius:12px;padding:8px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;text-align:center}
.stepper button{height:48px;border-radius:10px;background:var(--surface);font-size:1.4rem;font-weight:700}
.stepper b{font-family:var(--display);font-size:1.35rem;display:block;line-height:1.1}
.stepper small{font-size:.75rem;color:var(--muted)}
.hint{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.95rem}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--rest);color:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.restbar .in{max-width:var(--col,480px);margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.restbar .t{font-family:var(--display);font-weight:800;font-size:1.8rem;min-width:84px}
.restbar .track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
.restbar .fill{height:100%;background:var(--surface);width:100%}
.restbar button{min-height:44px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.18);color:var(--surface);font-weight:700}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(10,16,13,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--surface);width:100%;max-width:var(--col,480px);border-radius:18px 18px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.opt{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.note{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.paylist{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.payrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.save{font-size:.8rem;font-weight:700;background:var(--brass-soft);color:var(--brass);border-radius:999px;padding:3px 10px;white-space:nowrap}
.paylinks{display:flex;gap:4px 18px;flex-wrap:wrap;align-items:center}.paylinks a{color:var(--accent);text-underline-offset:3px}.paylinks .btn.link{min-height:36px;padding:0;font-size:inherit}
#sheet .btn[disabled]{opacity:.6}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---------- Jarl Premium: App Store subscription (iPhone app only) ---------- */

    state.hrdev={id,name:(r&&r.name)||name}; save(); BLE.busy=''; BLE.ok=state.hrdev.name;
    const P=state.player; if(P){ P.real=true; P.hr=null; P.lastHrAt=0; renderPlayer(); } else nat('JarlHR','disconnect',{}).catch(()=>{});
    sheet(bleHTML()); if(!P) render();
  }catch(e){ BLE.busy=''; BLE.err=e&&e.message==='timeout'?'No answer. Check that it’s broadcasting and close by, then tap it again.':((e&&e.message)||'Couldn’t connect.'); sheet(bleHTML()); }
}

const MON=T0-((new Date(T0).getDay()+6)%7)*DAY;
function weekDays(){const o=state.weekOverride; return (o&&o.mon===MON?o.days:state.days).slice().sort((a,b)=>a-b)}
function weekPlan(){
  const mon=MON, end=mon+7*DAY, done=state.history.filter(h=>h.d>=mon&&h.d<end), rec=recovery(), days=weekDays();
  let left=Math.max(0,days.length-done.length), s=rec.next; const plan=[];
  for(const i of days){const d=mon+i*DAY; if(!left) break; if(d<T0||(d===T0&&rec.doneToday)||done.some(h=>h.d===d)) continue; plan.push({d,s,i}); s=nextLetter(s); left--;}
  return {mon,done,plan,days};
}
function currentS(){const w=weekPlan(),t=w.plan.find(p=>p.d===T0);return t?t.s:recovery().next}
function nextTraining(){const p=weekPlan().plan.find(x=>x.d>T0||(x.d===T0&&!recovery().doneToday)); return p?p.d:MON+7*DAY+Math.min(...state.days)*DAY}
function dayAdvice(){
  const n=state.days.length, b2b=consecutive(state.days);
  const lead={2:'<b>2 days a week.</b> Enough to keep your muscle.',3:'<b>3 days a week.</b> Recommended: builds muscle with a rest day between each training.'}[n]||`<b>${n} days a week.</b> Trainings 1, 2 and 3 repeat in order.`;
  const tail=b2b?' When trainings fall on back-to-back days, every second one becomes a <b>light day</b> automatically: two sets per exercise at the same weights.':(n<=3?' A rest day between each is ideal.':'');
  return `<p class="muted small">${lead}${tail} Pick 2 to 6 days. You can still move a single training on the Today screen.</p>`;
}
function consecutive(days){const d=days.slice().sort((a,b)=>a-b); return d.some((x,k)=>d.includes((x+1)%7))}
function moveSheet(fromIdx){
  const wk=weekPlan(), p=wk.plan.find(x=>x.i===fromIdx); if(!p) return;
  const opts=[...Array(7)].map((_,i)=>i).filter(i=>{const d=MON+i*DAY; return d>=T0&&!wk.done.some(h=>h.d===d)});
  sheet(`<span class="eyebrow">This week</span><h2>Move ${TN(p.s)}</h2><p class="muted">Pick a new day. Your usual training days stay the same next week.</p>
   <div class="daypick">${opts.map(i=>{const taken=wk.days.includes(i)&&i!==fromIdx;return `<button class="opt" data-act="movetoday" data-from="${fromIdx}" data-to="${i}" aria-pressed="${i===fromIdx}" ${taken?'disabled':''}><b>${DAYNAMES[i]}</b><span class="muted small">${fmtDay(MON+i*DAY,{day:'numeric',month:'short'})}${taken?' \u00b7 training':''}</span></button>`}).join('')}</div>
   <button class="btn ghost" data-act="closesheet">Cancel</button>`);
}
function moveTo(from,to){
  const days=weekDays().filter(x=>x!==from); if(!days.includes(to)) days.push(to);
  state.weekOverride={mon:MON,days}; save();
}
const mondayOf=t=>t-((new Date(t).getDay()+6)%7)*DAY;
function isWelcomeBack(){const r=recovery(); return !r.first&&!r.doneToday&&r.days>=10}
function trainingWeek(){if(!state.history.length) return 1; const f=Math.min(...state.history.map(h=>h.d)); return Math.round((MON-mondayOf(f))/(7*DAY))+1}
function isDeloadWeek(){return state.history.length>0 && trainingWeek()%6===0}
function isLightToday(){const r=recovery(); if(r.first||r.doneToday||r.days!==1||!weekPlan().plan.some(p=>p.d===T0)) return false; const y=state.history.find(h=>h.d===T0-DAY); return !!y&&!y.light}
function viewToday(){LIGHT=isLightToday(); try{return viewTodayInner()} finally{LIGHT=false}}
function viewTodayInner(){
  const rec=recovery(), wk=weekPlan(), today=wk.plan.find(p=>p.d===T0), upcoming=wk.plan.find(p=>p.d>T0), s=today?today.s:rec.next;
  const days=[...Array(7)].map((_,i)=>{const t=wk.mon+i*DAY; const dn=wk.done.find(h=>h.d===t); const pl=wk.plan.find(p=>p.d===t);
    const cls=['day',dn?'done':pl?'plan':'',t===T0?'today':''].join(' '), lbl=`${fmtDay(t)}${dn?', '+TN(dn.s)+' done':pl?', '+TN(pl.s)+' planned. Tap to move':', rest'}`;
    const inner=`<span>${short(t).slice(0,2)}</span><span class="dot">${dn?NUM[dn.s]:pl?NUM[pl.s]:''}</span>`;
    return pl?`<button class="${cls}" data-act="move" data-i="${i}" aria-label="${lbl}">${inner}</button>`:`<div class="${cls}" aria-label="${lbl}">${inner}</div>`}).join('');
  let head, coach, cta='';
  const nextTxt=upcoming?`${TN(upcoming.s)} is on <b>${fmtDay(upcoming.d)}</b>.`:`All of this week\u2019s training is done. Next: <b>${fmtDay(nextTraining())}</b>.`;
  if(rec.doneToday){
    head=`${TN(rec.last.s)} done`; coach=`<p class="coach rest">Good work. Your muscles rebuild over the next 48 hours. ${nextTxt}</p>`;
  } else if(today){
    head=`${TN(s)} is today`;
    coach=rec.first?`<p class="coach">Your first training. About ${minutes(s)} minutes. Pick weights you could lift 2\u20133 more times and focus on good form. The app learns your weights from here.</p>`
      :LIGHT?`<p class="coach rest">You trained yesterday, so today is a <b>light day</b>: two sets per exercise at last time\u2019s weights. About ${minutes(s)} minutes. Or move it to a later day.</p>`
      :rec.days>=2?`<p class="coach">${rec.days} days since your last training, so you\u2019ve recovered. About ${minutes(s)} minutes. Stop each set with 1\u20132 reps left in the tank.</p>`
      :`<p class="coach">Yesterday was a light day, so today is a full training. About ${minutes(s)} minutes. Stop each set with 1\u20132 reps left in the tank.</p>`;
    cta=`<button class="btn primary" data-act="start" data-s="${s}">Start ${TN(s)}</button>`;
  } else {
    head='Rest day';
    coach=`<p class="coach rest">${rec.days<2?'You trained yesterday. ':''}Muscle is built while you rest, not while you lift. A 30-minute walk or the mobility routine below is the right move today. ${nextTxt}</p>`;
    if(upcoming) cta=`<button class="btn ghost" data-act="trainnow" data-i="${upcoming.i}">Train today instead</button>`;
  }
  const list=exFor(s).map((e,i)=>{const r=resolve(e);return `<li><span class="n">${i+1}</span><div><button class="exname" data-act="demo" data-name="${r.name}">${r.name}</button>${r.alt?`<span class="pill">${JOINT[r.altFor]}</span>`:''}</div><span class="sr num">${repLabel(r)}</span></li>`}).join('');
  const doneN=wk.done.length;
  const banner=(isWelcomeBack()&&(today||!upcoming)?`<p class="coach rest"><b>Welcome back.</b> It\u2019s been ${rec.days} days. Your next training starts about 15% lighter, so joints and tendons can catch up.</p>`:'')
    +(isDeloadWeek()?`<p class="coach rest"><b>Lighter week</b> (week ${trainingWeek()}). Same exercises at about 20% less weight. Every sixth week is lighter, so you keep progressing without wearing down.</p>`:'');
  return `
  <div class="stack"><span class="eyebrow">${fmtDay(T0)}</span><h1>${head}</h1>${coach}${banner}</div>
  <div class="card stack">
    <div class="row between"><h2>${TN(s)}</h2><span class="row" style="gap:6px">${LIGHT?'<span class="pill rest">Light day</span>':''}<span class="pill plain num">~${minutes(s)} min</span></span></div>
    <p class="muted small">${PROGRAM[s].focus}. Warm-up first: ${state.warm} minutes. Tap an exercise to see how it\u2019s done.</p>
    <details class="map"><summary>Show the muscles this works</summary>${bodyMap(trainingLoad(s),TN(s))}</details>
    <ol class="exlist">${list}</ol>
    ${cta}
  </div>
  <div class="stack">
    <div class="row between"><h3>This week</h3><span class="muted small num">${doneN} of ${Math.max(wk.days.length,doneN)} done</span></div>
    <div class="week">${days}</div>
    <p class="muted small">Tap a planned day to move it. ${doneN>=2?'Two trainings a week keep your muscle, three build it.':'Aim for a rest day between trainings.'} <button class="btn link small" style="min-height:0;padding:0" data-act="gotodays">Change your usual days</button></p>
  </div>
  <div class="stack">
    <div class="row between"><h3>Your three numbers</h3><button class="btn link" data-tab="progress">Details</button></div>
    ${threeNumbers()}
  </div>
  <div class="card stack">
    <div class="row between"><h3>8-minute mobility</h3><span class="pill rest">Rest days</span></div>
    <p class="muted small">Six gentle moves for hips, back, shoulders, ankles and neck, each with a demo. Safe to do every day.</p>
    <button class="btn ghost" data-act="mobility">Show the routine</button>
  </div>`;
}

function spark(vals,{w=320,h=90,fmt=v=>v,color='var(--accent)'}={}){
  const pad={l:6,r:40,t:12,b:12}; const mn=Math.min(...vals), mx=Math.max(...vals);
  const x=i=>pad.l+i*(w-pad.l-pad.r)/(vals.length-1), y=v=>pad.t+(mx===mn?0.5:(mx-v)/(mx-mn))*(h-pad.t-pad.b);
  const p=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const li=vals.length-1;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trend from ${fmt(vals[0])} to ${fmt(vals[li])}">
   <line x1="${pad.l}" x2="${w-pad.r}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)" stroke-dasharray="3 4"/>
   <line x1="${pad.l}" x2="${w-pad.r}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--line)" stroke-dasharray="3 4"/>
   <text x="${w-pad.r+6}" y="${y(mx)+4}" font-size="12" fill="var(--muted)">${fmt(mx)}</text>
   <text x="${w-pad.r+6}" y="${y(mn)+4}" font-size="12" fill="var(--muted)">${fmt(mn)}</text>
   <path d="${p}L${x(li)},${h-pad.b}L${x(0)},${h-pad.b}Z" fill="${color}" opacity=".12"/>
   <path d="${p}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${x(li)}" cy="${y(vals[li])}" r="5" fill="${color}"/></svg>`;
}

function mmss(s){s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function tick(){
  const P=state.player; if(!P) return;
  const el=$('#elapsed'); if(el) el.textContent=mmss((Date.now()-P.t0)/1000)+' elapsed';
  const now=Date.now(), dt=(now-P.lastT)/1000; P.lastT=now; const on=pulseOn();
  if(on&&!P.real){ const target=P.idx===-1?96:84, tau=P.idx===-1?60:32;
    P.hr=target+(P.hr-target)*Math.exp(-dt/tau)+(Math.random()-.5)*.8; P.hrLog.push(P.hr); }
  const fresh=P.real?(P.hr&&now-P.lastHrAt<(P.hrSrc==='bluetooth'?15000:180000)):on;
  if(on){ const c=$('#hrchip'); if(c){ if(fresh){const z=zone(P.hr); c.style.setProperty('--hrc',z[1]); c.innerHTML=`${HEART}${Math.round(P.hr)}<small>${z[0]}</small>`;} else {c.style.setProperty('--hrc','var(--muted)'); c.innerHTML=`${HEART}<small>${P.real&&!P.lastHrAt&&now-P.t0>90000?'No live pulse':state.hrdev?'Waiting for '+esc(state.hrdev.name):'Waiting for watch'}</small>`;} }
    const w=$('#hrwait'); if(w) w.hidden=!(P.real&&!P.lastHrAt&&now-P.t0>45000); }
  const hr=Math.round(P.hr||0), high=on&&fresh&&P.hr>maxHR()*.85, ready=on&&fresh&&P.hr<readyHR();
  const pulseLine=state.hrMed?'Rest until your breathing has settled.':(on&&fresh)?(high?`<b>Pulse ${hr}.</b> That\u2019s high. Take the full rest.`:ready?`<b>Pulse ${hr}.</b> Recovered. Go when you\u2019re ready.`:`Pulse ${hr}. Ready under ${readyHR()}.`):'Rest. Breathe.';
  const bar=$('#restbar');
  if(P.rest){const left=(P.rest.end-Date.now())/1000;
    if(left<=0){ if(!P.rest.over){P.rest.over=true; try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
      bar.innerHTML=P.rest.next!=null?`<div class="in"><span style="flex:1"><b>Rest over.</b> Next: ${resolve(exFor(P.s)[P.rest.next]).name}.</span><button data-act="nextex">Go</button></div>`
        :`<div class="in"><span style="flex:1"><b>Rest over.</b> Next set when you’re ready.</span><button data-act="restskip">OK</button></div>`;
    } else bar.innerHTML=`<div class="in"><span class="t num">${mmss(left)}</span><span style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="small">${P.rest.label?`<b>${P.rest.label}.</b> `:''}${pulseLine}</span><span class="track"><span class="fill" style="display:block;width:${(left/P.rest.total*100).toFixed(1)}%"></span></span></span><button data-act="restadd">+15 s</button><button data-act="restskip">Skip</button></div>`;
    bar.hidden=false;
  } else bar.hidden=true;
}
function logSet(){LIGHT=!!(state.player&&state.player.light); try{logSetInner()} finally{LIGHT=false}}
function logSetInner(){
  const P=state.player, e=exFor(P.s)[P.idx], r=resolve(e), n=setsFor(r);
  const logs=P.logs[e.id]=P.logs[e.id]||[]; logs.push({w:P.cur.w,r:P.cur.r});
  if(!P.real){const bump=r.unit==='min'?Math.max(0,maxHR()*.66-P.hr):r.unit==='sec'?6:r.unit==='bw'?20:r.unit==='m'?36:30; P.hr=Math.min(maxHR()*.9,P.hr+bump+Math.random()*6); P.hrLog.push(P.hr);}

    if(nx>-1){ const rs=restFor(r)||45; P.rest={end:Date.now()+rs*1000,total:rs,next:nx,label:`${r.name} done`}; renderPlayer(); return; }
    P.rest=null; P.idx=99; renderPlayer(); return; }

// The next exercise with sets left, after the current one (or from the top)
function nextOpen(P){const ex=exFor(P.s), left=(x)=>(P.logs[x.id]||[]).length<setsFor(resolve(x)); let i=ex.findIndex((x,k)=>k>P.idx&&left(x)); if(i<0) i=ex.findIndex(left); return i;}
function closePlayer(){if(state.player&&state.player.real) stopPulse(); clearInterval(window._tick); state.player=null; $('#player').hidden=true; $('#restbar').hidden=true; document.body.style.overflow=''; render();}

async function completeSession(effort){

    right:'That’s exactly the zone that builds muscle without wearing you down. Same plan next time.',

    case 'reset': if(!state.resetArm){state.resetArm=true; render(); setTimeout(()=>{state.resetArm=false},5000); break;} try{localStorage.removeItem('jarl-v1');localStorage.removeItem('jarl-welcome')}catch(e){} location.reload(); break;
    case 'terms-close': termsClose(); break;
    case 'terms-decline': termsClose(); sheet(`<h2>You can look, but not train yet</h2><p>To use Jarl, you need to accept the User Agreement. You can read it any time from the welcome screen or the You tab.</p><button class="btn ghost" data-act="closesheet">OK</button>`); break;
    case 'terms-accept': { if(!$('#terms-check')||!$('#terms-check').checked) break; state.terms={version:TERMS_VERSION,at:Date.now()}; save(); const nx=termsNext; termsClose();
      if(nx==='welcome-go'||nx==='welcome-skip'){ const b=document.createElement('button'); b.dataset.act=nx; b.hidden=true; document.body.appendChild(b); b.click(); b.remove(); }
      else if(nx&&nx.startsWith('start:')) gateStart(nx.slice(6)); else render();
      break; }
    case 'move': moveSheet(+t.dataset.i); break;
    case 'movetoday': moveTo(+t.dataset.from,+t.dataset.to); closeSheet(); render(); break;
    case 'trainnow': {const ti=(new Date(T0).getDay()+6)%7; moveTo(+t.dataset.i,ti); render(); window.scrollTo(0,0); break;}
    case 'gotodays': state.tab='profile'; render(); setTimeout(()=>{const el=document.getElementById('days'); el&&el.scrollIntoView({block:'start'})},50); break;
    case 'toggleday': {const i=+t.dataset.i, d=state.days; state.dayMsg=false; if(d.includes(i)){ if(d.length>2) state.days=d.filter(x=>x!==i); } else { if(d.length<6) state.days=[...d,i]; else state.dayMsg=true; } state.weekOverride=null; save(); render(); setTimeout(()=>{const el=document.getElementById('days'); el&&el.scrollIntoView({block:'center'})},0); break;}
    case 'defaultdays': state.days=[0,2,4]; state.dayMsg=false; state.weekOverride=null; save(); render(); setTimeout(()=>{const el=document.getElementById('days'); el&&el.scrollIntoView({block:'center'})},0); break;
    case 'welcome-go': if(!termsOk()){termsOpen('welcome-go'); break;} state.welcome=false; state.onboard=true; state.tab='profile'; try{localStorage.setItem('jarl-welcome','1')}catch(e){} render(); window.scrollTo(0,0); break;
    case 'welcome-skip': state.welcome=false; state.tab='today'; try{localStorage.setItem('jarl-welcome','1')}catch(e){} render(); window.scrollTo(0,0); break;
    case 'welcome-show': state.welcome=true; render(); window.scrollTo(0,0); break;
    case 'onboard-done': state.onboard=false; state.tab='today'; render(); window.scrollTo(0,0); break;
    case 'demo': demoSheet(t.dataset.name); break;
    case 'toggleanim': toggleAnim(t.querySelector('svg')); break;
    case 'allowhealth': { const done=()=>{state.health.connected=true; save(); closeSheet(); if(state.player){state.player.lastT=Date.now(); renderPlayer()} else render(); loadHealth();};
      if(NATIVE){ t.disabled=true; t.textContent='Asking Apple Health\u2026'; let answered=false;
        const slow=setTimeout(()=>{ if(answered||$('#sheet').hidden) return; healthHelp(); },20000);
        nat('JarlHealth','requestAuthorization',{}).then(r=>{answered=true; clearTimeout(slow); done(r);}).catch(err=>{ answered=true; clearTimeout(slow); closeSheet(); sheet(`<h2>Apple Health isn\u2019t available</h2><p>${(err&&err.message)||'Something went wrong.'}</p><p class="muted small">You can change Health access any time in the iPhone Settings app, under <b>Health</b>, then <b>Data Access &amp; Devices</b>, then <b>Jarl</b>.</p><button class="btn ghost" data-act="closesheet">OK</button>`); }); }
      else done();
      break; }
    case 'disconnect': state.health.connected=false; save(); render(); break;
    case 'blefind': bleSheet(); break;
    case 'blepick': blePick(t.dataset.id,t.dataset.name); break;
    case 'blecancel': nat('JarlHR','stopScan',{}).catch(()=>{}); closeSheet(); break;
    case 'bleforget': nat('JarlHR','disconnect',{}).catch(()=>{}); state.hrdev=null; save(); render(); break;
    case 'healthmanual': state.health.connected=true; save(); closeSheet(); if(state.player){state.player.real=NATIVE; state.player.hr=null; nat('JarlHealth','startHeartRate',{since:Date.now()-60000}).catch(()=>{}); renderPlayer()} else render(); loadHealth(); break;
  }
});
document.addEventListener('change',ev=>{
  if(ev.target.dataset&&ev.target.dataset.pref){state[ev.target.dataset.pref]=ev.target.checked; save(); render(); return;}
  if(ev.target.id==='terms-check'){const b=$('#terms-accept'); if(b) b.disabled=!ev.target.checked; return;}
  const t=ev.target;
  if(t.dataset.joint){state.joints[t.dataset.joint]=t.checked; Object.keys(state.swaps).forEach(k=>delete state.swaps[k]); save();}
  if(t.id==='age'){const v=+t.value; if(v>=40&&v<=90){state.age=v; save();}}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#sheet').hidden) closeSheet();});
render();
loadHealth();
</script>
